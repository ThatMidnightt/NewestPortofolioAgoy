<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kirim pesan ke Nalendra Yoga lewat form email." />
    <meta name="theme-color" content="#F6F3EC" />
    <title>Email me — Nalendra Yoga</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1712'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23F6F3EC' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- My CSS -->
    <link rel="stylesheet" href="Email.css" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="m11 18-6-6 6-6" />
        </svg>
        Kembali ke portfolio
      </a>

      <div class="card">
        <p class="eyebrow">Contact form</p>
        <h1>Email me<span class="accent">.</span></h1>
        <p class="sub">
          Ada pertanyaan, ide kolaborasi, atau sekadar mau nyapa? Isi form di
          bawah — pesannya langsung masuk ke inbox-ku.
        </p>

        <form action="https://formspree.io/f/xgogznlq" method="POST">
          <!-- Honeypot anti-spam -->
          <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />

          <div class="field">
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="Nama" placeholder="Nama kamu" required />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="Email" placeholder="nama@email.com" required />
          </div>

          <div class="field">
            <label for="komentar">Pesan</label>
            <textarea id="komentar" name="Komentar" rows="5" placeholder="Tulis pesanmu di sini..." required></textarea>
          </div>

          <button type="submit" class="submit">
            Kirim pesan
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14" />
              <path d="m13 6 6 6-6 6" />
            </svg>
          </button>
        </form>

        <p class="alt">
          Atau email langsung ke
          <a href="mailto:yoganalendra812@gmail.com">yoganalendra812@gmail.com</a>
        </p>
      </div>
    </main>
  </body>
</html>
